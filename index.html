<title>Mohamed Naser | Social Links</title>
<style>
*{box-sizing:border-box}
:root{--bg:#100306;--panel:#1b090d;--wine:#4a1019;--red:#9f1d2b;--text:#fff;--muted:#c4aeb2}
body{
 margin:0;min-height:100vh;padding:28px 16px;display:flex;align-items:center;justify-content:center;
 font-family:Tahoma,Arial,sans-serif;color:var(--text);
 background:radial-gradient(ellipse at 50% 10%,#451018 0%,#21080d 36%,#090205 78%);
}
main{
 width:min(100%,430px);padding:28px 22px 24px;text-align:center;
 background:linear-gradient(160deg,rgba(56,13,21,.94),rgba(15,5,9,.97));
 border:1px solid rgba(255,95,111,.22);border-radius:26px;
 box-shadow:0 24px 70px #000a,0 0 35px #8d172433;
}
.avatar{width:142px;height:142px;object-fit:cover;object-position:center 35%;border-radius:50%;border:3px solid #a52b3a;box-shadow:0 0 28px #b52c3c55}
h1{font-size:28px;margin:15px 0 6px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 23px}
.links{display:grid;gap:11px}
a,
\n.copy{
 display:flex;align-items:center;justify-content:center;gap:10px;min-height:51px;
 color:#fff;text-decoration:none;font-family:inherit;font-size:16px;font-weight:700;
 background:linear-gradient(100deg,#341017,#51121d);border:1px solid #a33a484d;
 border-radius:14px;padding:13px 14px;transition:transform .18s,filter .18s;cursor:pointer
}
a:hover,.copy:hover{transform:translateY(-2px);filter:brightness(1.2)}
.wa{background:linear-gradient(100deg,#075b43,#087c58);border-color:#32b88955}
.fb{background:linear-gradient(100deg,#17376b,#2456a4);border-color:#6c9df655}
.copy{width:100%}
small{display:block;color:#9f858b;margin-top:19px;font-size:12px}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
 const modal = document.getElementById('app-qr-modal');
 const qrBox = document.getElementById('app-qr-code');
 const title = document.getElementById('app-qr-title');
 const urlText = document.getElementById('app-qr-url');
 let timer = null, longPressTriggered = false, targetLink = null;

 function showQR(link) {
   if (!window.QRCode) {
     alert('تعذر تحميل مولّد QR. تأكد من اتصال الإنترنت وحاول مرة أخرى.');
     return;
   }
   const url = link.href;
   const label = (link.innerText || 'الحساب').trim();
   title.textContent = 'امسح الرمز لفتح ' + label;
   urlText.textContent = url;
   qrBox.innerHTML = '';
   new QRCode(qrBox, {text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.H});
   modal.style.display = 'flex';
 }

 document.addEventListener('pointerdown', e => {
   const link = e.target.closest('a[href]');
   if (!link) return;
   targetLink = link;
   longPressTriggered = false;
   timer = setTimeout(() => {
     longPressTriggered = true;
     showQR(link);
   }, 650);
 });
 function cancelTimer() {
   if (timer) clearTimeout(timer);
   timer = null;
 }
 document.addEventListener('pointerup', cancelTimer);
 document.addEventListener('pointercancel', cancelTimer);
 document.addEventListener('pointermove', cancelTimer);
 document.addEventListener('click', e => {
   if (longPressTriggered && e.target.closest('a[href]')) {
     e.preventDefault();
     e.stopPropagation();
     longPressTriggered = false;
   }
 }, true);
 document.addEventListener('contextmenu', e => {
   if (e.target.closest('a[href]')) e.preventDefault();
 });
 document.getElementById('app-qr-close').addEventListener('click', () => modal.style.display = 'none');
 modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
})();
</script>
